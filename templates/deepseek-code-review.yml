name: DeepSeek Code Review

# Thin caller. The review itself lives in Vegarg77/workflows and is shared by every repo, so fix
# it there, not here. Installed by Vegarg77/workflows/scripts/setup-repo.ps1.

on:
  pull_request:
    types: [opened, synchronize, reopened]

# The called workflow can only use what is granted here.
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    uses: Vegarg77/workflows/.github/workflows/deepseek-code-review.yml@main
    secrets: inherit
